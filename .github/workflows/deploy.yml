name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      functions:
        description: 'Edge-funktiot julkaistavaksi (välilyönnillä eroteltu, "all" = kaikki). Tyhjä = vain muuttuneet.'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bc-smartapp

  # Supabase edge-funktiot: julkaistaan vain muuttuneet (supabase/functions/<nimi>/**, käytetyt _shared-tiedostot,
  # config.toml → kaikki config.toml:n funktiot). verify_jwt luetaan config.toml:sta, jotta asetus ei vaihdu.
  # Huom: Supabase GitHub -integraatio julkaisee myös config.toml:n funktiot main-pushista; sama koodi → harmiton.
  deploy-edge-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'qvqmemeexberatbqxivw' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine functions to deploy
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_FUNCTIONS: ${{ github.event.inputs.functions }}
        run: |
          set -euo pipefail
          all_functions() {
            find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts \
              | awk -F/ '{print $3}' | grep -v '^_' | sort -u
          }
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN puuttuu — ohitetaan."
            echo "list=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_FUNCTIONS}" ]; then
            if [ "${INPUT_FUNCTIONS}" = "all" ]; then list=$(all_functions); else list="${INPUT_FUNCTIONS}"; fi
          else
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="${GITHUB_SHA}~1"
            fi
            changed=$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" -- supabase/functions supabase/config.toml || true)
            echo "Muuttuneet tiedostot:"; echo "${changed:-–}"
            list=""
            for path in ${changed}; do
              case "${path}" in
                supabase/config.toml)
                  list="${list} $(sed -n 's/^\[functions\.\(.*\)\]$/\1/p' supabase/config.toml)";;
                supabase/functions/_shared/*)
                  shared=$(basename "${path}")
                  list="${list} $(grep -l "_shared/${shared}" supabase/functions/*/*.ts 2>/dev/null | awk -F/ '{print $3}' | grep -v '^_' || true)";;
                supabase/functions/*/*)
                  list="${list} $(echo "${path}" | awk -F/ '{print $3}')";;
              esac
            done
          fi
          final=""
          for fn in $(echo ${list} | tr ' ' '\n' | sort -u); do
            if [ -f "supabase/functions/${fn}/index.ts" ]; then final="${final} ${fn}"; else echo "Ohitetaan ${fn} (ei index.ts:ää)"; fi
          done
          final=$(echo ${final})
          echo "Julkaistavat: ${final:-ei yhtään}"
          echo "list=${final}" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        if: steps.plan.outputs.list != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        if: steps.plan.outputs.list != ''
        env:
          FUNCTIONS: ${{ steps.plan.outputs.list }}
        run: |
          set -euo pipefail
          for fn in ${FUNCTIONS}; do
            verify=$(awk -v s="[functions.${fn}]" '$0==s{f=1;next} /^\[/{f=0} f && $1=="verify_jwt"{print $3}' supabase/config.toml)
            if [ -z "${verify}" ]; then
              echo "::error::${fn}: verify_jwt puuttuu supabase/config.toml:sta — lisää [functions.${fn}] ennen julkaisua."
              exit 1
            fi
            flags="--project-ref ${SUPABASE_PROJECT_REF} --use-api"
            if [ "${verify}" = "false" ]; then flags="${flags} --no-verify-jwt"; fi
            echo "::group::${fn} (verify_jwt=${verify})"
            supabase functions deploy "${fn}" ${flags}
            echo "::endgroup::"
          done

      - name: Smoke test
        if: steps.plan.outputs.list != ''
        env:
          FUNCTIONS: ${{ steps.plan.outputs.list }}
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          for fn in ${FUNCTIONS}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "${base}/${fn}")
            echo "${fn}: OPTIONS ${code}"
            [ "${code}" = "200" ] || { echo "::error::${fn} ei vastaa (OPTIONS ${code})"; exit 1; }
          done
          if echo " ${FUNCTIONS} " | grep -q " work-report-print-share "; then
            curl -fsS -X POST -H 'Content-Type: application/json' -d '{"ping":true}' "${base}/work-report-print-share" | tee /dev/stderr | grep -q '"ok":true'
          fi
