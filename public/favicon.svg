<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="BC Smartapp">
  <!-- Continuous house: peak → right eaves → right wall (stops above check) → left eaves → left wall → base -->
  <path
    d="M64 14 L108 52 V78 M64 14 L20 52 V108 H62"
    stroke="#2563eb"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Checkmark integrates as lower-right corner; tip slightly below base; long arm up-right -->
  <path
    d="M46 84 L70 110 L120 48"
    stroke="#2563eb"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Airflow waves (soft S-curves) -->
  <path
    d="M32 70 C40 62, 48 78, 56 70 S72 62, 80 70"
    stroke="#2563eb"
    stroke-width="9.5"
    stroke-linecap="round"
  />
  <path
    d="M32 88 C40 80, 48 96, 56 88 S72 80, 80 88"
    stroke="#2563eb"
    stroke-width="9.5"
    stroke-linecap="round"
  />
</svg>
