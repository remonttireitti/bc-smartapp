project_id = "bc-smartapp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://bc-smartapp.vercel.app"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/aseta-uusi-salasana",
  "https://bc-smartapp.vercel.app",
  "https://bc-smartapp.vercel.app/aseta-uusi-salasana",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.calculate-trip-distance]
verify_jwt = true

[functions.temp-monitor-ingest]
verify_jwt = false

[functions.vrf-monitor-ingest]
verify_jwt = false

[functions.vrf-device-config]
verify_jwt = false
