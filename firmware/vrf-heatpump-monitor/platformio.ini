[env:waveshare_esp32s3_eth]
platform = espressif32@6.9.0
; Waveshare ESP32-S3-WROOM-1U-N16R8: 16 MB flash + 8 MB OPI PSRAM (wiki + ESPHome)
board = esp32s3box
board_build.partitions = default_16MB.csv
framework = arduino
; Oletus tassa koneessa; muuta jos ESP on toisessa portissa.
upload_port = COM3
monitor_speed = 115200
board_build.embed_txtfiles =
    src/portal/portal.css
    public/assets/heat-pump-schematic.svg
build_src_filter =
  +<*>
  -<scanner_main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; W5500 RJ45 WAN (Espressif core sisältää W5500-driverin valmiina)
  -DUSE_ETHERNET=1
  ; 1 = Internet vain RJ45-kaapelilla; Wi-Fi = vain määritys-SoftAP (ei STA-WAN).
  -DETHERNET_ONLY_WAN=1
lib_deps =
  milesburton/DallasTemperature @ ^3.11.0
  paulstoffregen/OneWire @ ^2.3.8
  bblanchon/ArduinoJson @ ^7.2.0
  knolleary/PubSubClient @ ^2.8

[env:waveshare_esp32s3_eth_strict_rj45]
platform = espressif32@6.9.0
board = esp32s3box
board_build.partitions = default_16MB.csv
framework = arduino
upload_port = COM3
monitor_speed = 115200
board_build.embed_txtfiles =
    src/portal/portal.css
    public/assets/heat-pump-schematic.svg
build_src_filter =
  +<*>
  -<scanner_main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DUSE_ETHERNET=1
  -DETHERNET_ONLY_WAN=1
lib_deps =
  milesburton/DallasTemperature @ ^3.11.0
  paulstoffregen/OneWire @ ^2.3.8
  bblanchon/ArduinoJson @ ^7.2.0
  knolleary/PubSubClient @ ^2.8

[env:waveshare_scanner]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM3
monitor_speed = 115200
build_src_filter =
  +<scanner_main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  milesburton/DallasTemperature @ ^3.11.0
  paulstoffregen/OneWire @ ^2.3.8
